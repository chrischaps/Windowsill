[package]
name = "windowsill"
version = "0.0.1"
edition = "2024"
description = "A thin, living windowsill that rests on the Windows taskbar."

[dependencies]
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
notify = "8"
cpal = "0.18"
realfft = "3"
ringbuf = "0.5"
triple_buffer = "9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation", "Win32_Foundation"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_RemoteDesktop",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The same naga wgpu uses, to check the shader without a GPU.
naga = { version = "30", features = ["wgsl-in"] }

[profile.release]
lto = "thin"
codegen-units = 1
