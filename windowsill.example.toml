# windowsill.toml: every key is optional, and a missing file means defaults.
#
# Put it next to windowsill.exe, or in %APPDATA%\Windowsill. The sill re-reads
# it whenever it is saved, and eases into the new look over two seconds.
# If an edit doesn't make sense, the sill logs why and keeps the last good one.

# Where the sill is in the world, for the sun and moon. Left out, the sill asks
# Windows' location service, and if that is off the light is plain daylight:
# the sill never guesses. Set here, Windows is never asked.
# latitude = 47.61
# longitude = -122.33

# The way you face when you look at the screen, and the way the room's window
# looks out, in degrees clockwise from north (0 north, 90 east, 180 south,
# 270 west). The sill's light then agrees with the light on your desk: the sun
# only shines in while it is in front of the window, and the rest of the day the
# sky's softer light comes from the window's side. Left out, you face the
# equator and the sill is its own window, letting the sun in from either side.
# facing = 0
# window = 90

# Frames per second while the room is quiet, and while music plays.
fps_idle = 15
fps_music = 30

[palette]
wood = "#6b4529"   # the jar's wooden lid
lip  = "#946642"   # the lid's top edge, where it catches the light

# The things standing on the taskbar. `at` is where each stands, from 0
# at the left end of the sill to 1 at the right, until a hand moves it: hold
# one, carry it along the taskbar and let go. Where they were last set down is
# kept in %APPDATA%\Windowsill\arranged.toml, and changing `at` here moves that
# thing again.
[plant]
at   = 0.72
pot  = "#a85c3d"   # the clay pot
leaf = "#4f7a3d"   # the leaves in full light

[jar]
at    = 0.75
glass = "#d1e6e0"   # shows mostly at its edges
water = "#78a1a8"   # a little over half full

[candle]
at    = 0.775
wax   = "#ede3cc"
flame = "#ffb252"   # the flame, and the warmth it throws

# The cat sleeps where `at` says until it gets up by itself: to lie on the side
# of the others the sun comes from, or by the candle at night. Tap it and it
# gets up, stretches and lies down again a little way off.
[cat]
at   = 0.80
fur  = "#8f8780"   # a soft grey tabby
mark = "#4d4845"   # its stripes

# The room's light through the day and night (Fishbowl's palette), keyed by how
# high the sun is in degrees. `ambient` is the colour every lit thing takes on;
# `vivid` how much of its own colour it keeps, from 0 (grey) to 1. Dawn and dusk
# come at the same height, so a key can belong to the "rising" or "setting" sun;
# without `when` it is both. The palette eases between keys, and any [[sky]]
# here replace the whole set.
[[sky]]   # late night
elevation = -40
ambient   = "#475985"
vivid     = 0.35

[[sky]]   # night
elevation = -18
ambient   = "#4d618f"
vivid     = 0.35

[[sky]]   # dawn
elevation = 0
when      = "rising"
ambient   = "#ccc2c7"
vivid     = 0.75

[[sky]]   # morning
elevation = 12
when      = "rising"
ambient   = "#fafaf5"
vivid     = 1.0

[[sky]]   # day
elevation = 30
ambient   = "#ffffff"
vivid     = 1.0

[[sky]]   # afternoon
elevation = 15
when      = "setting"
ambient   = "#fff7eb"
vivid     = 1.0

[[sky]]   # sunset
elevation = 2
when      = "setting"
ambient   = "#ffd6bd"
vivid     = 0.95

[[sky]]   # dusk
elevation = -5
when      = "setting"
ambient   = "#8f85a8"
vivid     = 0.65

[ease]
# How slowly the sill follows a change, in seconds: the time to cover about two
# thirds of it. Nothing may be quicker than 2.
light  = 4.0   # the sun, its colour, the moonlight and the sky
candle = 3.0   # the candle catching and going out
wax    = 60.0  # the candle burning down, and fresh again by morning
music  = 3.0   # the dust stirring with the music, and settling after it
