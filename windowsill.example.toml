# windowsill.toml: every key is optional, and a missing file means defaults.
#
# Put it next to windowsill.exe, or in %APPDATA%\Windowsill. The sill re-reads
# it whenever it is saved, and eases into the new look over two seconds.
# If an edit doesn't make sense, the sill logs why and keeps the last good one.

# Where the sill is in the world, for the sun and moon. Left out, the light is
# plain daylight: the sill never guesses.
# latitude = 47.61
# longitude = -122.33

# The way you face when you look at the screen, and the way the room's window
# looks out, in degrees clockwise from north (0 north, 90 east, 180 south,
# 270 west). The sill's light then agrees with the light on your desk: the sun
# only shines in while it is in front of the window, and the rest of the day the
# sky's softer light comes from the window's side. Left out, you face the
# equator and the sill is its own window, letting the sun in from either side.
# facing = 0
# window = 90

# Frames per second while the room is quiet, and while music plays.
fps_idle = 15
fps_music = 30

[palette]
wood       = "#6b4529"   # the ledge's face
wood_shade = "#54331f"   # the face toward its bottom edge
lip        = "#946642"   # the thin front edge that catches the light, and the top
grain      = "#452917"   # the darker lines of the grain along the board
glow       = "#805738"   # the warmth on the glass just above the ledge
glow_alpha = 0.42        # how strong that warmth starts, 0 to 1

# The three things on the ledge. `at` is where each stands, from 0 at the left
# end of the sill to 1 at the right.
[plant]
at   = 0.72
pot  = "#a85c3d"   # the clay pot
leaf = "#4f7a3d"   # the leaves in full light

[jar]
at    = 0.75
glass = "#d1e6e0"   # shows mostly at its edges
water = "#78a1a8"   # a little over half full

[candle]
at    = 0.775
wax   = "#ede3cc"
flame = "#ffb252"   # the flame, and the warmth it throws

# The room's light through the day and night (Fishbowl's palette), keyed by how
# high the sun is in degrees. `ambient` is the colour every lit thing takes on;
# `vivid` how much of its own colour it keeps, from 0 (grey) to 1. Dawn and dusk
# come at the same height, so a key can belong to the "rising" or "setting" sun;
# without `when` it is both. The palette eases between keys, and any [[sky]]
# here replace the whole set.
[[sky]]   # late night
elevation = -40
ambient   = "#475985"
vivid     = 0.35

[[sky]]   # night
elevation = -18
ambient   = "#4d618f"
vivid     = 0.35

[[sky]]   # dawn
elevation = 0
when      = "rising"
ambient   = "#ccc2c7"
vivid     = 0.75

[[sky]]   # morning
elevation = 12
when      = "rising"
ambient   = "#fafaf5"
vivid     = 1.0

[[sky]]   # day
elevation = 30
ambient   = "#ffffff"
vivid     = 1.0

[[sky]]   # afternoon
elevation = 15
when      = "setting"
ambient   = "#fff7eb"
vivid     = 1.0

[[sky]]   # sunset
elevation = 2
when      = "setting"
ambient   = "#ffd6bd"
vivid     = 0.95

[[sky]]   # dusk
elevation = -5
when      = "setting"
ambient   = "#8f85a8"
vivid     = 0.65

[ease]
# How slowly the sill follows a change, in seconds: the time to cover about two
# thirds of it. Nothing may be quicker than 2.
light  = 4.0   # the beam, its colour, the shadows, the moonlight and the sky
candle = 3.0   # the candle catching and going out
